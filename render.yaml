services:
  - type: web
    name: protrack-backend
    env: node
    rootDir: backend
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: protrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://protrack-auto.vercel.app" # UPDATE THIS TO YOUR VERCEL URL
    
databases:
  - name: protrack-db
    databaseName: protrack_production
    user: protrack_user
    plan: free
    region: ohio
